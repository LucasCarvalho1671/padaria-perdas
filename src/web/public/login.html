<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padaria Perdas — Login</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">🍞</div>
    <h1 class="login-titulo">Padaria Perdas</h1>
    <p class="login-sub">Faça login para continuar</p>

    <form id="form-login">
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div id="erro-login" class="alerta alerta-erro" style="display:none"></div>
      <button type="submit" class="btn btn-primario btn-block" id="btn-login">Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn  = document.getElementById('btn-login');
      const erro = document.getElementById('erro-login');
      erro.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Erro ao fazer login.');
        window.location.href = '/';
      } catch (err) {
        erro.textContent = err.message;
        erro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
