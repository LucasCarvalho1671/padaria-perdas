<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padaria Perdas</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c8622a" />
</head>
<body>

  <!-- SIDEBAR / MENU LATERAL -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">🍞</span>
      <span class="sidebar-titulo">Padaria Perdas</span>
      <button class="sidebar-fechar" id="btn-fechar-menu">✕</button>
    </div>
    <ul class="sidebar-menu" id="sidebar-menu"></ul>
    <div class="sidebar-footer">
      <span id="sidebar-usuario"></span>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </nav>

  <!-- OVERLAY escuro ao abrir menu no mobile -->
  <div class="overlay" id="overlay"></div>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="btn-menu" id="btn-abrir-menu">☰</button>
      <h2 class="topbar-titulo" id="topbar-titulo">Dashboard</h2>
    </header>
    <main class="conteudo" id="conteudo">
      <div class="carregando">Carregando...</div>
    </main>
  </div>

  <script>
    // ── Permissões padrão (espelho do backend — mantê-los sincronizados) ──
    window.PERMISSOES_PADRAO = {
      ver_dashboard:      true,
      ver_historico:      true,
      registrar_perda:    true,
      registrar_producao: true,
      editar_perda:       false,
      excluir_perda:      false,
      editar_producao:    false,
      excluir_producao:   false,
      exportar_relatorio: true,
      cadastrar_produto:  false,
      editar_produto:     false,
      excluir_produto:    false,
      gerenciar_motivos:       false,
      gerenciar_usuarios:      false,
      gerenciar_funcionarios:  false,
    };

    // Retorna true se o usuário logado tem a permissão solicitada.
    // Admin sempre retorna true. Para funcionários, usa as permissões
    // efetivas já mescladas que vêm do endpoint /api/auth/me.
    function temPermissao(perm) {
      const u = window.usuarioAtual;
      if (!u) return false;
      if (u.role === 'admin') return true;
      // permissoes já vem mesclado com PADRAO do /me endpoint
      return !!(u.permissoes?.[perm] ?? window.PERMISSOES_PADRAO[perm]);
    }
  </script>
  <script src="/dialogs.js"></script>
  <script src="/combobox.js"></script>
  <script src="/router.js"></script>
  <script src="/pages/dashboard.js"></script>
  <script src="/pages/dashboard-geral.js"></script>
  <script src="/pages/perdas.js"></script>
  <script src="/pages/producao.js"></script>
  <script src="/pages/historico.js"></script>
  <script src="/pages/produtos.js"></script>
  <script src="/pages/configuracoes.js"></script>
  <script src="/pages/funcionarios.js"></script>
  <script>
    // ── Gera o menu lateral com base no acesso e permissões ─────
    function gerarMenu(usuario) {
      const menu    = document.getElementById('sidebar-menu');
      const isAdmin = usuario.role === 'admin';
      const acesso  = usuario.acesso || 'ambos';

      // ── Título do sidebar muda conforme o acesso ──────────────
      const logos   = { padaria: '🍞', acougue: '🥩', ambos: '🍞' };
      const titulos = { padaria: 'Padaria Perdas', acougue: 'Açougue Perdas', ambos: 'Padaria Perdas' };
      document.querySelector('.sidebar-logo').textContent   = logos[acesso]   || '🍞';
      document.querySelector('.sidebar-titulo').textContent = titulos[acesso] || 'Padaria Perdas';

      // Verifica se o usuário tem acesso à página de produtos
      const podeVrProdutos = isAdmin
        || temPermissao('cadastrar_produto')
        || temPermissao('editar_produto')
        || temPermissao('excluir_produto');

      // Verifica se o usuário pode ver configurações
      const podeVrConfig = isAdmin
        || temPermissao('gerenciar_motivos')
        || temPermissao('gerenciar_usuarios')
        || temPermissao('gerenciar_funcionarios');

      const itensPadaria = `
        ${temPermissao('ver_dashboard')      ? `<li><a href="/" data-page="dashboard" class="menu-item">📊 Dashboard</a></li>` : ''}
        ${temPermissao('registrar_perda')    ? `<li><a href="/perdas" data-page="perdas" class="menu-item">📋 Registrar Perda</a></li>` : ''}
        ${temPermissao('registrar_producao') ? `<li><a href="/producao" data-page="producao" class="menu-item">🏭 Produção</a></li>` : ''}
        ${temPermissao('ver_historico')      ? `<li><a href="/historico" data-page="historico" class="menu-item">📂 Histórico</a></li>` : ''}
        ${podeVrProdutos ? `<li><a href="/produtos" data-page="produtos" class="menu-item">🥖 Produtos</a></li>` : ''}
      `;

      const itensAcougue = `
        ${temPermissao('ver_dashboard')      ? `<li><a href="/acougue" data-page="acougue-dashboard" class="menu-item">📊 Dashboard</a></li>` : ''}
        ${temPermissao('registrar_perda')    ? `<li><a href="/acougue/perdas" data-page="acougue-perdas" class="menu-item">📋 Registrar Perda</a></li>` : ''}
        ${temPermissao('registrar_producao') ? `<li><a href="/acougue/producao" data-page="acougue-producao" class="menu-item">🏭 Produção</a></li>` : ''}
        ${temPermissao('ver_historico')      ? `<li><a href="/acougue/historico" data-page="acougue-historico" class="menu-item">📂 Histórico</a></li>` : ''}
        ${podeVrProdutos ? `<li><a href="/acougue/produtos" data-page="acougue-produtos" class="menu-item">🥩 Produtos</a></li>` : ''}
      `;

      // Configurações — admin ou usuário com permissão de gestão
      const itemConfig = podeVrConfig ? `
        <li class="menu-secao-titulo menu-secao-geral">Geral</li>
        <li><a href="/configuracoes" data-page="configuracoes" class="menu-item">⚙️ Configurações</a></li>
      ` : '';

      if (acesso === 'padaria') {
        menu.innerHTML = itensPadaria + itemConfig;
      } else if (acesso === 'acougue') {
        menu.innerHTML = itensAcougue + itemConfig;
      } else { // 'ambos'
        menu.innerHTML = `
          ${temPermissao('ver_dashboard') ? `<li><a href="/dashboard-geral" data-page="dashboard-geral" class="menu-item">🏠 Visão Geral</a></li>` : ''}
          <li class="menu-secao-header">
            <span class="menu-secao-header-logo">🍞</span>
            <span class="menu-secao-header-nome">Padaria</span>
          </li>
          ${itensPadaria}
          <li class="menu-secao-header">
            <span class="menu-secao-header-logo">🥩</span>
            <span class="menu-secao-header-nome">Açougue</span>
          </li>
          ${itensAcougue}
          ${itemConfig}
        `;
      }
    }

    // ── Verificar autenticação ──────────────────────────────────
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) { window.location.href = '/login.html'; return; }
        const usuario = await res.json();
        window.usuarioAtual = usuario; // disponível globalmente para as páginas
        document.getElementById('sidebar-usuario').textContent = usuario.nome;

        gerarMenu(usuario);  // constrói o menu antes de initRouter
        initRouter();
      } catch {
        window.location.href = '/login.html';
      }
    })();

    // ── Menu mobile ─────────────────────────────────────────
    const sidebar  = document.getElementById('sidebar');
    const overlay  = document.getElementById('overlay');
    document.getElementById('btn-abrir-menu').onclick = () => {
      sidebar.classList.add('aberto');
      overlay.classList.add('visivel');
    };
    document.getElementById('btn-fechar-menu').onclick =
    overlay.onclick = () => {
      sidebar.classList.remove('aberto');
      overlay.classList.remove('visivel');
    };

    // ── Logout ───────────────────────────────────────────────
    document.getElementById('btn-logout').onclick = async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    // ── Placeholder para imagens de produto que não carregam ──
    document.addEventListener('error', function(e) {
      const img = e.target;
      if (img.tagName === 'IMG' && img.classList.contains('produto-thumb')) {
        const span = document.createElement('span');
        span.className = 'produto-thumb produto-thumb-vazio';
        span.textContent = '📷';
        img.parentNode.replaceChild(span, img);
      }
    }, true); // capture=true para pegar erros de imagens inseridas dinamicamente
  </script>
</body>
</html>
